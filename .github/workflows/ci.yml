name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '20'
            python: '3.9'
          - os: macos-15
            node: '22'
            python: '3.13'
          - os: windows-2025
            node: '22'
            python: '3.13'
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Record selected runtimes
        run: |
          node --version
          npm --version
          python -c "import sys; print(sys.version); print(sys.executable)"
          git --version
      - name: Release hashes and static checks (npm run check equivalent)
        run: |
          python scripts/update_manifest.py --check
          python scripts/check_package.py
      - name: JavaScript syntax
        run: npm run check:js
      - name: Python suite including real CRLF clones (browser cases explicitly skipped)
        run: python -m unittest discover -s tests -v
      - name: CLI, Python selection, offline npm tarball and both aliases
        env:
          AI_SLOP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm test
  browser:
    name: ubuntu-24.04 / Node 22 / Chrome regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      AI_SLOP_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Record runtimes and require existing Chrome
        run: |
          node --version
          python --version
          google-chrome --version
      - name: Run opt-in Chrome regressions on synthetic fixtures
        id: browser
        env:
          AI_SLOP_BROWSER_EVIDENCE: ${{ runner.temp }}/browser-evidence
        run: python -m unittest discover -s tests -p test_browser_checks.py -v
      - name: Preserve browser evidence, including failures
        if: ${{ always() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chrome-regression-evidence
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: error
          retention-days: 7
